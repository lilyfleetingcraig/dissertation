<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Editor</title>
        <script type="module" src="src/editor.ts"></script>
        <script
            type="module"
            src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule
            src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
        ></script>
        <link rel="stylesheet" href="src/base.css" type="text/css" />
    </head>

    <body>
        <header>
            <a href="./">
                <img
                    src="src/assets/logo.png"
                    alt="webblocks Logo"
                    id="header-logo"
                />
            </a>
        </header>
        <div class="resizable-area">
            <div class="panel left" id="view-panel">
                <div class="switch-tab" id="preview">
                    <div class="output-banner">
                        <div class="traffic-lights">
                            <div class="traffic-light red"></div>
                            <div class="traffic-light yellow"></div>
                            <div class="traffic-light green"></div>
                        </div>
                        <div class="search-bar">
                            <ion-icon name="globe" class="icon"></ion-icon>
                            <span id="preview-banner-title"></span>
                        </div>
                    </div>
                    <div id="preview-content"></div>
                </div>
                <div class="switch-tab" id="code">
                    <div class="code-output" id="html"></div>
                    <div class="code-output" id="css"></div>
                </div>
                <ul class="page-tabs" id="view-tabs">
                    <li
                        class="page-tab"
                        data-panel="view-panel"
                        data-tab="preview"
                    >
                        <ion-icon name="eye" class="page-tab-icon"></ion-icon>
                        Preview
                    </li>
                    <li
                        class="page-tab"
                        data-panel="view-panel"
                        data-tab="code"
                    >
                        <ion-icon
                            name="code-slash"
                            class="page-tab-icon"
                        ></ion-icon>
                        Code
                    </li>
                </ul>
            </div>
            <div class="resizer" id="resizer"></div>
            <div class="panel right" id="code-panel">
                <div id="blockly-area"></div>
                <div
                    class="switch-tab"
                    id="blockly-HTML-div"
                    style="position: absolute"
                ></div>
                <div
                    class="switch-tab"
                    id="blockly-CSS-div"
                    style="position: absolute"
                ></div>
                <ul class="page-tabs" id="code-tabs">
                    <li
                        class="page-tab"
                        data-panel="code-panel"
                        data-tab="blockly-HTML-div"
                    >
                        <ion-icon
                            name="browsers"
                            class="page-tab-icon"
                        ></ion-icon>
                        Structure
                    </li>
                    <li
                        class="page-tab"
                        data-panel="code-panel"
                        data-tab="blockly-CSS-div"
                    >
                        <ion-icon
                            name="color-palette"
                            class="page-tab-icon"
                        ></ion-icon>
                        Style
                    </li>
                </ul>
            </div>
        </div>
        <footer>
            <div class="sitemap">
                <div class="sitemap-home">
                    <ul class="sitemap-list">
                        <li class="sitemap-link sitemap-title">
                            <a href="">webblocks</a>
                        </li>
                        <li class="sitemap-link"><a href="">Home</a></li>
                    </ul>
                </div>
                <div class="sitemap-code">
                    <ul class="sitemap-list">
                        <li class="sitemap-link sitemap-title">
                            <a href="">Code</a>
                        </li>
                        <li class="sitemap-link">
                            <a href="">Start Coding</a>
                        </li>
                    </ul>
                </div>
                <div class="sitemap-accounts">
                    <ul class="sitemap-list">
                        <li class="sitemap-link sitemap-title"></li>
                    </ul>
                </div>
                <div class="sitemap-hidden"></div>
            </div>
            <a href="./" class="footer-logo-link">
                <img
                    src="src/assets/logo.png"
                    alt="webblocks Logo"
                    id="footer-logo"
                />
            </a>
        </footer>
    </body>
</html>
