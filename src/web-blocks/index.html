<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Blockly Sample App</title>
        <script type="module" src="src/editor.ts"></script>
        <link rel="stylesheet" href="./src/base.css" type="text/css" />
    </head>
    <body>
        <header>
            <h1>Blockly</h1>
        </header>
        <div class="resizable-area">
            <div class="panel left" id="view-panel">
                <div class="switch-tab" id="preview"></div>
                <div class="switch-tab" id="code"></div>
                <div class="page-tabs" id="view-tabs">
                    <ul>
                        <li
                            class="page-tab"
                            data-panel="view-panel"
                            data-tab="preview"
                        >
                            Preview Website
                        </li>
                        <li
                            class="page-tab"
                            data-panel="view-panel"
                            data-tab="code"
                        >
                            Preview Code
                        </li>
                    </ul>
                </div>
            </div>
            <div class="resizer" id="resizer"></div>
            <div class="panel right" id="code-panel">
                <div id="blockly-area"></div>
                <div
                    class="switch-tab"
                    id="blockly-HTML-div"
                    style="position: absolute"
                ></div>
                <div
                    class="switch-tab"
                    id="blockly-CSS-div"
                    style="position: absolute"
                ></div>
                <div class="page-tabs" id="code-tabs">
                    <ul>
                        <li data-panel="code-panel" data-tab="blockly-HTML-div">
                            HTML
                        </li>
                        <li data-panel="code-panel" data-tab="blockly-CSS-div">
                            CSS
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <footer>
            <h1>This is a footer</h1>
            <p>
                This is the text that goes in a footer, I need this to see how
                it offets bla bla.
            </p>
        </footer>
    </body>
</html>
